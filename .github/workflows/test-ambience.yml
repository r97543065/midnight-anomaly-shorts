name: Test subtle ambience
on:
  push:
    branches: [feature/subtle-horror-ambience]
    paths: ["scripts/make_video.py", "tests/test_ambience.py", ".github/workflows/test-ambience.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -p 'test_ambience.py' -v
