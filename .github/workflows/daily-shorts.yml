name: Build bilingual horror shorts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "stories/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/daily-shorts.yml"
      - "preview/**"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install edge-tts pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Build videos
        id: build
        run: python scripts/make_video.py

      - name: Production QA
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: python scripts/production_qa.py

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midnight-shorts-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: warn
      - name: Prepare preview site
        if: ${{ success() }}
        run: |
          mkdir -p preview-site
          cp preview/index.html preview-site/index.html
          cp output/zh.mp4 output/en.mp4 output/production-status.json preview-site/
          touch preview-site/.nojekyll

      - name: Configure Pages
        if: ${{ success() }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ success() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview-site

      - name: Deploy preview
        if: ${{ success() }}
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          enablement: true

      - name: Preview URL
        if: ${{ steps.deployment.outcome == 'success' }}
        run: |
          echo "### Video preview" >> "$GITHUB_STEP_SUMMARY"
          echo "https://r97543065.github.io/midnight-anomaly-shorts/" >> "$GITHUB_STEP_SUMMARY"
