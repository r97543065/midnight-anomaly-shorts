name: Build bilingual horror shorts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "stories/**"
      - "assets/**"
      - "jobs/**"
      - "scripts/**"
      - ".github/workflows/daily-shorts.yml"
      - "preview/**"

concurrency:
  group: shorts-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Prefer the already-reviewed AI job when present. Set AI_AD_JOB_ENABLED=false
      # explicitly to opt into the legacy feed path instead.
      PRODUCT_AD_FILE: ${{ vars.PRODUCT_ADS_ENABLED == 'true' && vars.AI_AD_JOB_ENABLED == 'false' && 'output/product-ad.json' || '' }}
      DAILY_AD_JOB_FILE: ${{ vars.AI_AD_JOB_ENABLED != 'false' && 'jobs/daily-ad-job.json' || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig fonts-noto-cjk
          fc-match -f '%{family}\n' 'Noto Sans CJK TC' | grep -F 'Noto Sans CJK TC'

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir edge-tts==7.3.1 pillow fonttools
          ffmpeg -version
          ffprobe -version

      - name: Verify PNG JPEG and WebP scene support
        run: python -m unittest discover -s tests -p "test_scene_images.py" -v

      - name: Select verified product and generate silent ad
        if: ${{ vars.PRODUCT_ADS_ENABLED == 'true' && vars.AI_AD_JOB_ENABLED == 'false' }}
        env:
          SHOPEE_AFFILIATE_FEED_URL: ${{ secrets.SHOPEE_AFFILIATE_FEED_URL }}
          SHOPEE_AFFILIATE_FEED_TOKEN: ${{ secrets.SHOPEE_AFFILIATE_FEED_TOKEN }}
        run: python scripts/product_ads.py --render-preview

      - name: Validate AI creative handoff
        if: ${{ vars.AI_AD_JOB_ENABLED != 'false' }}
        run: python scripts/ai_ad_job.py --job jobs/daily-ad-job.json

      - name: Build videos
        id: build
        run: python scripts/make_video.py

      - name: Production QA
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: python scripts/production_qa.py

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midnight-shorts-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: warn
      - name: Prepare preview site
        if: ${{ success() }}
        run: |
          mkdir -p preview-site
          cp preview/index.html preview-site/index.html
          cp output/zh.mp4 output/en.mp4 output/production-status.json preview-site/
          touch preview-site/.nojekyll

      - name: Configure Pages
        if: ${{ success() }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ success() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview-site

      - name: Deploy preview
        if: ${{ success() }}
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          enablement: true

      - name: Preview URL
        if: ${{ steps.deployment.outcome == 'success' }}
        run: |
          echo "### Video preview (GitHub Pages may be public; no YouTube upload)" >> "$GITHUB_STEP_SUMMARY"
          echo "https://r97543065.github.io/midnight-anomaly-shorts/" >> "$GITHUB_STEP_SUMMARY"
