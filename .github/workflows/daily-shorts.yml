name: Build bilingual horror shorts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "stories/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/daily-shorts.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install edge-tts pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Build videos
        run: python scripts/make_video.py

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midnight-shorts-v2
          path: output/
          if-no-files-found: warn