name: One-time PRIVATE YouTube upload - voicemail 2026-11-01

# This source episode was explicitly user-approved for YouTube upload.
# Run at most once after merging THIS single workflow onto main.
# Never upload videos publicly or add affiliate advertisements/comments.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-private-youtube-voicemail-20261101.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: one-shot-voicemail-youtube-20261101
  cancel-in-progress: false

jobs:
  private-upload:
    if: >-
      ${{ github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'chore: request one-time private YouTube upload for voicemail 2026-11-01') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_RUN_ID: "41304008987"
      SOURCE_ATTEMPT: "1"
      SOURCE_SHA: "a280c6bb5d9069de15eb207f9678fcbd067a0f67"
      EXPECTED_STORY_ID: "voicemail_from_tomorrow_20261101"
      EXPECTED_CHANNEL_ID: "UCoJaSnd5EybHJEJ47Q5aZdQ"
      EXACT_ARTIFACT_NAME: "reviewed-voicemail-41304008987-1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify YouTube OAuth credentials are configured
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          required=("YOUTUBE_CLIENT_ID","YOUTUBE_CLIENT_SECRET","YOUTUBE_REFRESH_TOKEN")
          missing=[x for x in required if not os.environ.get(x)]
          if missing:
              raise RuntimeError("Missing required GitHub YouTube OAuth secret names: " + ", ".join(missing))
          print("OAuth secrets present; no values logged")
          PY
      - name: Download the EXACT pre-approved bilingual artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloaded output
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$EXACT_ARTIFACT_NAME" --dir downloaded
          test -f downloaded/output/production-status.json
          test -s downloaded/output/zh.mp4
          test -s downloaded/output/en.mp4
          cp -a downloaded/output/. output/
      - name: Verify source run, commit, story, artifact and both video QA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)"
          test "$source_sha" = "$SOURCE_SHA"
          python - <<'PY'
          import json,os
          from pathlib import Path
          qa=json.loads(Path("output/production-status.json").read_text(encoding="utf-8"))
          assert str(qa.get("run_id"))==os.environ["SOURCE_RUN_ID"], "Source run mismatch"
          assert str(qa.get("run_attempt"))==os.environ["SOURCE_ATTEMPT"], "Attempt mismatch"
          assert qa.get("commit_sha")==os.environ["SOURCE_SHA"], "Build commit mismatch"
          assert qa.get("story_id")==os.environ["EXPECTED_STORY_ID"], "Story mismatch"
          assert qa.get("qa_status")=="success" and qa.get("build_result")=="success", "Production not successful"
          assert not qa.get("errors") and not qa.get("warnings"), "QA had issues"
          assert qa.get("scene_count")==8, "Expected 8 reviewed scenes"
          assert qa.get("product_ad",{}).get("enabled") is False, "Advertisement is not approved"
          for lang in ("zh","en"):
              vid=Path("output")/(lang+".mp4")
              item=qa["videos"][lang]
              assert vid.stat().st_size==item["size_bytes"] and vid.stat().st_size>100000, "Video bytes mismatch"
              assert 60<=float(item["duration_seconds"])<=90, "Video length out of bounds"
              assert item["video"]["codec_name"]=="h264", "Wrong codec"
              assert (item["video"]["width"],item["video"]["height"])==(1080,1920), "Wrong dimensions"
              assert item["video"]["r_frame_rate"]=="30/1", "Wrong frame rate"
              assert item["audio"]["codec_name"]=="aac", "Missing AAC audio"
              assert item["checks"]["full_decode"] is True, "Video cannot decode"
          print("Exact QA-approved original bilingual videos verified; advertisement OFF")
          PY
      - name: Check out exact source commit and verify story metadata
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          python - <<'PY'
          import json,os
          from pathlib import Path
          story=json.loads(Path("stories/bonus/20261101-voicemail-from-tomorrow.json").read_text(encoding="utf-8"))
          job=json.loads(Path("jobs/voicemail-20261101.json").read_text(encoding="utf-8"))
          assert story["story_id"]==job["story_id"]==os.environ["EXPECTED_STORY_ID"],"Story metadata mismatch"
          assert job["publication_approved"] is False and job["product_ad"]["enabled"] is False
          assert len(story["assets"]["images"])==len(job["scene_images"])==8
          assert story["youtube"]["title_zh"] and story["youtube"]["title_en"]
          assert story["youtube"]["description_zh"] and story["youtube"]["description_en"]
          print("Source bilingual titles and descriptions verified")
          PY
      - name: Validate OAuth token AND exact YouTube channel identity
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,sys
          from urllib.request import Request,urlopen
          sys.path.insert(0,"scripts")
          from upload_youtube import token
          access=token()
          req=Request("https://www.googleapis.com/youtube/v3/channels?part=id&mine=true",
                      headers={"Authorization":"Bearer "+access})
          with urlopen(req,timeout=30) as resp:
              data=json.load(resp)
          ids=[x.get("id") for x in data.get("items",[])]
          assert os.environ["EXPECTED_CHANNEL_ID"] in ids, "Connected channel is NOT the authorized channel"
          print("Authorized YouTube channel verified")
          PY
      - name: Upload Mandarin video to YouTube as PRIVATE only
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          STORY_FILE: "stories/bonus/20261101-voicemail-from-tomorrow.json"
          DAILY_AD_JOB_FILE: "jobs/voicemail-20261101.json"
          UPLOAD_LANGUAGE: "zh"
          YOUTUBE_PRIVACY: "private"
        run: python scripts/upload_youtube.py
      - name: Upload English video to YouTube as PRIVATE only
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          STORY_FILE: "stories/bonus/20261101-voicemail-from-tomorrow.json"
          DAILY_AD_JOB_FILE: "jobs/voicemail-20261101.json"
          UPLOAD_LANGUAGE: "en"
          YOUTUBE_PRIVACY: "private"
        run: python scripts/upload_youtube.py
